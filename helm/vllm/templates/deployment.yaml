{{- $isOmni := eq .Values.mode "omni" }}
{{- $port := ternary .Values.service.omniPort .Values.service.port $isOmni }}
{{- $imageConfig := ternary .Values.image.omni .Values.image.text $isOmni }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ $imageConfig.repository }}:{{ $imageConfig.tag }}"
          imagePullPolicy: {{ $imageConfig.pullPolicy }}
          {{- if $isOmni }}
          command:
            - "vllm"
            - "serve"
          args:
            - {{ .Values.model | quote }}
            - "--omni"
            - "--port"
            - {{ $port | quote }}
            {{- if .Values.servedModelName }}
            - "--served-model-name"
            - {{ .Values.servedModelName | quote }}
            {{- end }}
            {{- if .Values.gpuMemoryUtilization }}
            - "--gpu-memory-utilization"
            - {{ .Values.gpuMemoryUtilization | quote }}
            {{- end }}
            {{- if not (or (empty .Values.maxNumSeqs) (eq (toString .Values.maxNumSeqs) "null")) }}
            - "--max-num-seqs"
            - {{ .Values.maxNumSeqs | quote }}
            {{- end }}
            {{- if not (or (empty .Values.tensorParallelSize) (eq (toString .Values.tensorParallelSize) "null")) }}
            - "--tensor-parallel-size"
            - {{ .Values.tensorParallelSize | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else }}
          args:
            - "--model"
            - {{ .Values.model | quote }}
            - "--port"
            - {{ $port | quote }}
            {{- if .Values.servedModelName }}
            - "--served-model-name"
            - {{ .Values.servedModelName | quote }}
            {{- end }}
            {{- if .Values.gpuMemoryUtilization }}
            - "--gpu-memory-utilization"
            - {{ .Values.gpuMemoryUtilization | quote }}
            {{- end }}
            {{- if not (or (empty .Values.maxNumSeqs) (eq (toString .Values.maxNumSeqs) "null")) }}
            - "--max-num-seqs"
            - {{ .Values.maxNumSeqs | quote }}
            {{- end }}
            {{- if not (or (empty .Values.tensorParallelSize) (eq (toString .Values.tensorParallelSize) "null")) }}
            - "--tensor-parallel-size"
            - {{ .Values.tensorParallelSize | quote }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
              protocol: TCP
          env:
            - name: VLLM_PORT
              value: {{ $port | quote }}
            {{- $secretName := .Values.existingSecret | default (printf "%s-hf-token" (include "vllm.fullname" .)) }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: HF_TOKEN
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: HF_TOKEN
                  optional: true
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            {{- if .Values.cache.enabled }}
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            {{- end }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- if .Values.cache.enabled }}
        - name: hf-cache
          hostPath:
            path: {{ .Values.cache.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
