apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-text
  labels:
    app: vllm
    component: text-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      component: text-llm
  template:
    metadata:
      labels:
        app: vllm
        component: text-llm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.17.0
          args:
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--served-model-name"
            - "qwen-small"
            - "--port"
            - "8000"
            - "--gpu-memory-utilization"
            - "0.2"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: 4Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: hf-cache
          hostPath:
            path: /home/johnsonhk88/.cache/huggingface
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-text-service
  labels:
    app: vllm
    component: text-llm
spec:
  type: ClusterIP
  selector:
    app: vllm
    component: text-llm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
